name: AI情報を収集

on:
  schedule:
    - cron: "17 */2 * * *" # 2時間ごと（UTC）
    - cron: "0 15 * * *" # 毎日深夜0時（日本時間）
  workflow_dispatch: # Actions 画面から手動でも実行できる
  push:
    # 作業用ブランチへのプッシュでは動かさない（公開ページは ccr-9eb32590-esny4k だけから作る）
    branches: [ccr-9eb32590-esny4k]
    # data/curated.json などは Claude Code（/curate・/gear-guide・/demand）が更新したときにページを作り直すため
    paths: [feeds.toml, collector/**, data/curated.json, data/gear_guide.json, data/demand.json, .github/workflows/collect.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # 順番待ちの間に別の実行がデータを更新していることがあるため、常にブランチの最新を使う
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: フィードを収集してページを作る
        run: python collector/collect.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 収集データを保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          git diff --cached --quiet && exit 0
          git commit -m "収集データを更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
          # 同時に別の保存があって押し返されたら、取り込み直して最大3回までやり直す
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

  # Settings → Pages の Source を「GitHub Actions」にすると、ここでページが公開される。
  # 未設定でも収集は止まらないよう、このジョブの失敗は無視する。
  # 収集データの保存に失敗しても、ページは公開する。
  deploy:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
