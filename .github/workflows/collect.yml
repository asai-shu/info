name: AI情報を収集

on:
  schedule:
    - cron: "17 */2 * * *" # 2時間ごと（UTC）
  workflow_dispatch: # Actions 画面から手動でも実行できる
  push:
    branches: [main]
    paths: [feeds.toml, collector/**]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: フィードを収集してページを作る
        run: python collector/collect.py

      - name: 収集データを保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          git diff --cached --quiet || git commit -m "収集データを更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
