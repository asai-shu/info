name: Claudeで更新

# Claude が GitHub 上で .claude/skills/ の手順どおりに調べて、data/ のファイルを更新する。
# パソコンは不要。Settings → Secrets and variables → Actions に、
# ANTHROPIC_API_KEY（API の従量課金）か CLAUDE_CODE_OAUTH_TOKEN（Pro・Max プランの範囲内）のどちらかを登録しておく。
on:
  schedule:
    - cron: "23 22 * * *" # 注目記事（/curate）：毎朝7時23分（日本時間）
    - cron: "37 21 * * 0" # 需要リサーチ（/demand）：毎週月曜6時37分（日本時間）
    - cron: "41 1 1 * *" # おすすめ（/gear-guide）：毎月1日10時41分（日本時間）
  workflow_dispatch: # Actions 画面やアプリの「調べ直す」ボタンから手動でも実行できる
    inputs:
      task:
        description: 何を更新するか
        type: choice
        options: [demand, curate, gear-guide]
        default: demand

permissions:
  contents: write
  actions: write # 更新後にページを作り直す（collect.yml を動かす）ため
  id-token: write

concurrency:
  group: claude
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 何を更新するか決める
        id: task
        env:
          INPUT: ${{ inputs.task }}
          CRON: ${{ github.event.schedule }}
        run: |
          case "$CRON" in
            "23 22 * * *") task=curate ;;
            "37 21 * * 0") task=demand ;;
            "41 1 1 * *") task=gear-guide ;;
            *) task="$INPUT" ;;
          esac
          echo "name=$task" >> "$GITHUB_OUTPUT"
          echo "更新するもの: $task"

      - name: Claude の鍵が登録されているか確かめる
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$API_KEY" ] && [ -z "$OAUTH_TOKEN" ]; then
            echo "::error::Settings → Secrets and variables → Actions に ANTHROPIC_API_KEY か CLAUDE_CODE_OAUTH_TOKEN を登録してください（README の「Claudeによる更新」を参照）"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: コミットする人の名前を設定する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            .claude/skills/${{ steps.task.outputs.name }}/SKILL.md を読み、そこに書かれた手順どおりに最後まで実行してください。
            GitHub Actions の上で動いているので、質問はせずに自分で判断して進めてください。
            git の pull と push は SKILL.md に書かれたブランチ（${{ github.ref_name }}）に対して行ってください。
          claude_args: |
            --max-turns 120
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebSearch,WebFetch"

      # GitHub Actions が push した変更では、ほかのワークフローが自動で動かないため、ここでページを作り直す
      - name: ページを作り直す
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
