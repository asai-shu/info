# 収集するフィード（RSS / Atom）の一覧です。
# 追加したいときは [[feeds]] のかたまりをコピーして書き換えてください。
#
#   name     : 画面に表示する名前
#   url      : RSS / Atom の URL
#   category : 分類（画面の絞り込みに使います）
#   lang     : "ja"（日本語）または "en"（英語）
#   filter   : true にすると、AI関連のキーワードを含む記事だけ残します（AI専門でないサイト向け）
#   limit    : 1回の収集で取り込む最大件数（大量に流れるフィード向け。省略すると全件）

[settings]
keep_days = 14       # 何日前までの記事を残すか
max_items = 3000     # 保存する最大件数

# ---------- 日本語ニュース ----------

[[feeds]]
name = "ITmedia AI+"
url = "https://rss.itmedia.co.jp/rss/2.0/aiplus.xml"
category = "ニュース"
lang = "ja"

[[feeds]]
name = "GIGAZINE"
url = "https://gigazine.net/news/rss_2.0/"
category = "ニュース"
lang = "ja"
filter = true

[[feeds]]
