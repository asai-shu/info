<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI情報まとめ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="AI情報">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3b5bfd">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1d2129; --muted: #6b7280;
  --line: #e3e6ea; --accent: #2563eb; --accent-bg: #e8efff; --new: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111317; --card: #1b1e24; --text: #e6e8eb; --muted: #9aa1ab;
          --line: #2c3038; --accent: #7aa2ff; --accent-bg: #1f2a44; --new: #f87171; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line); }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
h1 { font-size: 20px; margin: 14px 0 2px; }
.titlebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#reload { border: 1px solid var(--line); background: var(--card); color: var(--accent); border-radius: 999px;
          padding: 4px 12px; font-size: 13px; cursor: pointer; margin-top: 10px; }
.meta { color: var(--muted); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 12px; }
input[type=search] { flex: 1 1 220px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
                     background: var(--card); color: var(--text); font-size: 15px; }
select { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
        padding: 3px 12px; font-size: 13px; cursor: pointer; }
.chip.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
h2 { font-size: 14px; color: var(--muted); margin: 22px 0 8px; }
article { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
article a.title { color: var(--text); text-decoration: none; font-weight: 600; }
article a.title:hover { color: var(--accent); text-decoration: underline; }
article p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
.tags a { color: var(--accent); }
.badge { color: var(--new); font-weight: 700; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
.tab { flex: 0 0 auto; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted);
       padding: 8px 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.intro { margin: 14px 0 4px; color: var(--muted); font-size: 13px; }
.reasons { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.reason { background: var(--accent-bg); color: var(--accent); border-radius: 4px; padding: 0 6px; font-size: 11.5px; }
article p.digest { color: var(--text); }
article.curated { border-color: var(--accent); }
.original { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.point { background: var(--accent-bg); border-radius: 6px; padding: 6px 8px; margin-top: 8px !important; color: var(--text) !important; }
.point b, .overview b { color: var(--accent); margin-right: 6px; }
.overview { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; font-size: 14px; }
.notice { background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; color: var(--muted); }
h2 .sub { font-weight: 400; font-size: 12px; margin-left: 6px; }
details { margin: 24px 0 40px; color: var(--muted); font-size: 13px; }
details li.ng { color: var(--new); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="titlebar"><h1>AI情報まとめ</h1><button id="reload" type="button">更新</button></div>
    <div class="meta" id="meta"></div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-tab="tech">技術の進歩</button>
      <button class="tab" data-tab="money">収益化のヒント</button>
      <button class="tab" data-tab="all">すべての記事</button>
    </nav>
    <div class="controls">
      <input type="search" id="q" placeholder="キーワードで検索（例: Claude、画像生成）">
      <select id="lang">
        <option value="">すべての言語</option>
      </select>
      <select id="range">
        <option value="0">全期間</option>
        <option value="1">24時間以内</option>
        <option value="3">3日以内</option>
        <option value="7">7日以内</option>
      </select>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main class="wrap"><p class="intro" id="intro"></p><div id="list"></div></main>
<div class="wrap"><details id="status"></details></div>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent) || { items: [], statuses: [] };
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// 前回ページを開いた時刻より新しい記事に「NEW」を付ける
const lastVisit = store.get("lastVisit");
store.set("lastVisit", new Date().toISOString());

const categories = [...new Set(DATA.items.map((i) => i.category))];
const LANGS = { ja: "日本語", en: "英語", zh: "中国語", ko: "韓国語", de: "ドイツ語", fr: "フランス語", es: "スペイン語" };
const foreign = [...new Set(DATA.items.map((i) => i.lang))].filter((l) => l !== "ja");
$("lang").insertAdjacentHTML("beforeend",
  `<option value="ja">日本語のみ</option><option value="foreign">海外（日本語以外）</option>` +
  foreign.map((l) => `<option value="${esc(l)}">${esc(LANGS[l] || l)}のみ</option>`).join(""));
let activeCategory = "";

const TABS = {
  tech: "新しいAIモデル・研究成果・性能向上など、AI技術の進歩に関する記事を注目度の高い順に並べています。",
  money: "副業・個人開発・起業・学生向けコンテストなど、大学生がAIで収益につなげるヒントになりそうな記事を並べています。",
  all: "",
};
let tab = TABS[store.get("tab")] !== undefined ? store.get("tab") : "tech";
const THEME_LIMIT = 60;      // テーマのページに載せる最大件数
const PER_SOURCE_LIMIT = 3;  // 同じ取得元の記事ばかりにならないよう、1つの取得元から載せる最大件数

// 新しい記事ほど上に来るよう、テーマの点数に新しさを加える
function rank(i) {
  const hours = (Date.now() - new Date(i.date).getTime()) / 3600000;
  const fresh = hours < 24 ? 3 : hours < 72 ? 1.5 : hours < 168 ? 0 : -2;
  return i.themes[tab].score + fresh;
}

function pickTheme(items) {
  const perSource = {};
  return items
    .filter((i) => i.themes && i.themes[tab])
    .sort((a, b) => rank(b) - rank(a) || (a.date < b.date ? 1 : -1))
    .filter((i) => (perSource[i.source] = (perSource[i.source] || 0) + 1) <= PER_SOURCE_LIMIT)
    .slice(0, THEME_LIMIT);
}

function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function dayLabel(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  const base = `${d.getMonth() + 1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`;
  return diff === 0 ? `今日 ${base}` : diff === 1 ? `昨日 ${base}` : base;
}

function renderChips() {
  const counts = {};
  DATA.items.forEach((i) => (counts[i.category] = (counts[i.category] || 0) + 1));
  $("chips").innerHTML = [["", `すべて ${DATA.items.length}`], ...categories.map((c) => [c, `${c} ${counts[c]}`])]
    .map(([c, label]) => `<button class="chip${c === activeCategory ? " on" : ""}" data-c="${esc(c)}">${esc(label)}</button>`)
    .join("");
}

function matches(i, { words, lang, since, useCategory }) {
  const text = `${i.title} ${i.summary} ${i.source} ${i.publisher || ""} ${i.title_ja || ""} ${i.summary_ja || ""}`;
  return (!useCategory || !activeCategory || i.category === activeCategory) &&
    (!lang || i.lang === lang || (lang === "foreign" && i.lang !== "ja")) &&
    new Date(i.date).getTime() >= since &&
    words.every((w) => text.toLowerCase().includes(w));
}

// mode: "all"（すべての記事）/ "theme"（キーワードで選んだ記事）/ "curated"（Claude が選んだ記事）
function card(i, mode) {
  const d = new Date(i.date);
  const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const time = mode === "all" ? hm : `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
  const isNew = lastVisit && i.date > lastVisit;
  const translate = i.lang !== "ja"
    ? `<a href="https://translate.google.com/translate?sl=auto&tl=ja&u=${encodeURIComponent(i.link)}" target="_blank" rel="noopener">日本語に翻訳して読む</a>`
    : "";
  let body;
  if (mode === "curated") {
    body = `<a class="title" href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title_ja)}</a>
      ${i.title_ja !== i.title ? `<div class="original">${esc(i.title)}</div>` : ""}
      <p class="digest">${esc(i.summary_ja)}</p>
      <p class="point"><b>${tab === "money" ? "活かし方" : "ポイント"}</b>${esc(i.point)}</p>`;
  } else if (mode === "theme") {
    body = `<a class="title" href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>
      ${i.digest ? `<p class="digest">${esc(i.digest)}</p>` : ""}
      <div class="reasons">${i.themes[tab].reasons.map((r) => `<span class="reason">${esc(r)}</span>`).join("")}</div>`;
  } else {
    body = `<a class="title" href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>
      ${i.summary ? `<p>${esc(i.summary)}</p>` : ""}`;
  }
  return `<article${mode === "curated" ? ' class="curated"' : ""}>${body}
    <div class="tags">${isNew ? '<span class="badge">NEW</span>' : ""}
      <span>${time}</span><span>${esc(i.publisher ? `${i.publisher}（${i.source}）` : i.source)}</span><span>${esc(i.category)}</span>${translate}</div>
  </article>`;
}

function render() {
  const days = Number($("range").value);
  const opts = {
    words: $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean),
    lang: $("lang").value,
    since: days ? Date.now() - days * 86400000 : 0,
    useCategory: tab === "all",
  };
  const filtered = DATA.items.filter((i) => matches(i, opts));
  let html = "", count = 0;

  if (tab === "all") {
    let currentDay = "";
    for (const i of filtered) {
      const label = dayLabel(new Date(i.date));
      if (label !== currentDay) { html += `<h2>${label}</h2>`; currentDay = label; }
      html += card(i, "all");
    }
    count = filtered.length;
  } else {
    const curated = DATA.curated && DATA.curated[tab] ? DATA.curated[tab] : [];
    const picks = curated.filter((i) => matches(i, opts));
    if (curated.length) {
      const gen = new Date(DATA.curated.generated);
      const ago = Math.floor((Date.now() - gen) / 86400000);
      html += `<h2>Claudeが選んだ注目記事 <span class="sub">${gen.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })} 選定${ago >= 2 ? `（${ago}日前）` : ""}</span></h2>`;
      if (DATA.curated.overview && !opts.words.length) html += `<div class="overview"><b>今日のまとめ</b>${esc(DATA.curated.overview)}</div>`;
      html += picks.map((i) => card(i, "curated")).join("") || '<p class="empty">条件に合う注目記事はありません。</p>';
    } else {
      html += '<p class="notice">Claudeによる選定・日本語要約はまだありません。デスクトップ版の Claude Code でこのリポジトリを開き、<code>/curate</code> と入力すると表示されます。</p>';
    }
    const pickedIds = new Set(curated.map((i) => i.id));
    const rest = pickTheme(filtered.filter((i) => !pickedIds.has(i.id)));
    html += `<h2>キーワードで選んだその他の記事</h2>` + rest.map((i) => card(i, "theme")).join("");
    count = picks.length + rest.length;
  }

  $("list").innerHTML = html || '<p class="empty">該当する記事はありません。</p>';
  const fmt = (s) => new Date(s).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  $("meta").textContent = `${count}件を表示 ・ 収集 ${DATA.updated ? fmt(DATA.updated) : "—"}` +
    (DATA.curated && DATA.curated.generated ? ` ・ Claude選定 ${fmt(DATA.curated.generated)}` : "");
  $("intro").textContent = TABS[tab];
  $("intro").hidden = !TABS[tab];
  $("chips").hidden = tab !== "all";
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
}

function renderStatus() {
  const s = DATA.statuses || [];
  const ng = s.filter((x) => !x.ok).length;
  $("status").innerHTML = `<summary>取得元 ${s.length}件（失敗 ${ng}件）</summary><ul>` +
    s.map((x) => `<li class="${x.ok ? "" : "ng"}">${esc(x.name)}：${x.ok ? `${x.count}件取得・新規${x.added}件` : `取得失敗（${esc(x.error || "")}）`}</li>`).join("") +
    "</ul>";
}

$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;
  activeCategory = b.dataset.c;
  renderChips(); render();
});
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (!b) return;
  tab = b.dataset.tab;
  store.set("tab", tab);
  render();
  window.scrollTo(0, 0);
});
["q", "lang", "range"].forEach((id) => $(id).addEventListener("input", render));

renderChips(); render(); renderStatus();

// ホーム画面のアプリは前に開いたページをそのまま見せることがあるため、
// 開いたとき・画面に戻ったときに新しいデータがないか確かめ、あれば読み込み直す
function reloadFresh() {
  location.replace(`${location.pathname}?v=${Date.now()}`);
}

async function checkForUpdate() {
  try {
    const res = await fetch(`version.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) return;
    const remote = await res.json();
    const time = (s) => (s ? new Date(s).getTime() : 0);
    const newer = time(remote.updated) > time(DATA.updated) ||
      time(remote.curated) > time(DATA.curated && DATA.curated.generated);
    // 配信側のキャッシュで古いページが返り続けたときに、読み込み直しを繰り返さないようにする
    const target = `${remote.updated}|${remote.curated}`;
    let tried = null;
    try { tried = sessionStorage.getItem("reloadTarget"); } catch {}
    if (newer && tried !== target) {
      try { sessionStorage.setItem("reloadTarget", target); } catch {}
      reloadFresh();
    }
  } catch {}
}

$("reload").addEventListener("click", reloadFresh);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });
window.addEventListener("pageshow", (e) => { if (e.persisted) checkForUpdate(); });
setInterval(checkForUpdate, 10 * 60 * 1000);
checkForUpdate();
</script>
</body>
</html>
