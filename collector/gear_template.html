<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機材・ソフトガイド</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3b5bfd">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1d2129; --muted: #6b7280;
  --line: #e3e6ea; --accent: #2563eb; --accent-bg: #e8efff; --warn: #b45309; --warn-bg: #fef3c7;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111317; --card: #1b1e24; --text: #e6e8eb; --muted: #9aa1ab;
          --line: #2c3038; --accent: #7aa2ff; --accent-bg: #1f2a44; --warn: #fbbf24; --warn-bg: #3a2e12; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line); }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
.titlebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.titlebar h1 { white-space: nowrap; }
/* 右上のメニュー（ページの切り替え） */
.menu { position: relative; margin-top: 12px; }
.menu summary { list-style: none; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--accent);
                border-radius: 999px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
.menu summary::-webkit-details-marker { display: none; }
.menu-list { position: absolute; right: 0; top: calc(100% + 6px); z-index: 2; min-width: 180px; padding: 6px;
             background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
.menu-list a { display: block; color: var(--text); font-size: 15px; padding: 10px 12px; border-radius: 6px; text-decoration: none; }
.menu-list a:hover { background: var(--accent-bg); color: var(--accent); }
.menu-list a.on { color: var(--accent); font-weight: 700; }
h1 { font-size: 20px; margin: 14px 0 2px; }
.back { border: 1px solid var(--line); background: var(--card); color: var(--accent); border-radius: 999px;
        padding: 4px 12px; font-size: 13px; text-decoration: none; margin-top: 10px; white-space: nowrap; }
.meta { color: var(--muted); font-size: 13px; }
.sections { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
.section { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px;
           padding: 5px 12px; font-size: 14px; font-weight: 600; text-decoration: none; }
.section.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tabs { display: flex; gap: 4px; margin-top: 6px; overflow-x: auto; }
.tab { flex: 0 0 auto; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted);
       padding: 8px 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 12px; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
        padding: 3px 12px; font-size: 13px; cursor: pointer; }
.chip.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.lead { margin: 14px 0 4px; font-size: 14px; }
.note { margin: 6px 0 4px; color: var(--muted); font-size: 12.5px; }
h2 { font-size: 14px; color: var(--muted); margin: 22px 0 8px; }
article { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.name { font-weight: 700; font-size: 16px; }
.price { color: var(--accent); font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
article p { margin: 6px 0 0; font-size: 14px; overflow-wrap: anywhere; }
.for { background: var(--accent-bg); border-radius: 6px; padding: 6px 8px; margin-top: 8px !important; }
.for b, .caution b { color: var(--accent); margin-right: 6px; }
.caution { background: var(--warn-bg); border-radius: 6px; padding: 6px 8px; margin-top: 6px !important; }
.caution b { color: var(--warn); }
.sources { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
.sources a { color: var(--accent); overflow-wrap: anywhere; }
footer { margin: 24px 0 40px; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="titlebar"><h1>機材・ソフトガイド</h1><details class="menu" id="menu"><summary>☰ メニュー</summary><nav class="menu-list"><a href="./">記事一覧</a><a href="demand.html">需要リサーチ</a><a href="gear-pc.html" class="on">機材・ソフトガイド</a></nav></details></div>
    <div class="meta" id="meta"></div>
    <nav class="sections" id="sections"></nav>
    <nav class="tabs" id="tabs"></nav>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main class="wrap">
  <p class="lead" id="lead"></p>
  <p class="note" id="note"></p>
  <div id="list"></div>
</main>
<footer class="wrap">記事のリンク先は外部サイトです。価格や在庫は変わるため、購入前に必ず販売店で確認してください。</footer>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
// このページが表示する区分（pc / gadget / software / other）と、機材・ソフトガイド全体のデータ
const PAGE = JSON.parse(document.getElementById("data").textContent) || { section: "", guide: { tiers: {}, sections: {}, items: [] } };
const GUIDE = PAGE.guide;
const SECTION = GUIDE.sections[PAGE.section];
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

const tierKeys = Object.keys(GUIDE.tiers);
let tier = tierKeys.includes(store.get("gearTier")) ? store.get("gearTier") : tierKeys[0];
let category = "";

function render() {
  const items = GUIDE.items.filter((i) => i.section === PAGE.section && i.tier === tier);
  const categories = [...new Set(items.map((i) => i.category))];
  if (category && !categories.includes(category)) category = "";

  $("tabs").innerHTML = tierKeys.map((k) =>
    `<button class="tab${k === tier ? " on" : ""}" data-tier="${esc(k)}">${esc(GUIDE.tiers[k].label)}</button>`).join("");
  $("chips").innerHTML = [["", "すべて"], ...categories.map((c) => [c, c])].map(([c, label]) =>
    `<button class="chip${c === category ? " on" : ""}" data-c="${esc(c)}">${esc(label)}</button>`).join("");
  $("lead").textContent = SECTION.lead[tier];

  let html = "";
  for (const c of categories) {
    if (category && c !== category) continue;
    html += `<h2>${esc(c)}</h2>`;
    for (const i of items.filter((x) => x.category === c)) {
      html += `<article>
        <div class="name">${esc(i.name)}</div>
        <div class="price">${esc(i.price)}</div>
        <p>${esc(i.why)}</p>
        <p class="for"><b>こんな人に</b>${esc(i.for)}</p>
        ${i.caution ? `<p class="caution"><b>注意</b>${esc(i.caution)}</p>` : ""}
        <ul class="sources">${i.sources.map((s) =>
          `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join("")}</ul>
      </article>`;
    }
  }
  $("list").innerHTML = html;
}

document.title = `機材・ソフトガイド｜${SECTION.title}`;
$("sections").innerHTML = Object.entries(GUIDE.sections).map(([k, s]) =>
  `<a class="section${k === PAGE.section ? " on" : ""}" href="gear-${esc(k)}.html">${esc(s.label)}</a>`).join("");
const fmtTime = (s) => new Date(s).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
// 毎晩の自動更新が動いたことを、内容に変更がない日でも分かるようにする
const checked = GUIDE.checked && GUIDE.checked.at ? ` ・ 最終確認 ${fmtTime(GUIDE.checked.at)}（${GUIDE.checked.result || "確認済み"}）` : "";
$("meta").textContent = `${GUIDE.updated} 時点の情報` + checked;
$("note").textContent = GUIDE.note;
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (!b) return;
  tier = b.dataset.tier;
  store.set("gearTier", tier);
  render();
  window.scrollTo(0, 0);
});
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;
  category = b.dataset.c;
  render();
});
render();
// メニューの外を押したら閉じる
document.addEventListener("click", (e) => { if (!$("menu").contains(e.target)) $("menu").open = false; });
</script>
</body>
</html>
